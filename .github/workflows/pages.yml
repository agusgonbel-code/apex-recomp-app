name: Verificar y publicar APEX RECOMP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar integridad y funciones de la aplicación
        run: node test-integration.cjs
      - name: Construir distribución pública segura
        run: node scripts/build-public.cjs
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar guardado y recuperación en navegador
        run: node scripts/browser-smoke.cjs
      - name: Conservar distribución verificada
        uses: actions/upload-artifact@v4
        with:
          name: apex-recomp-dist
          path: dist/
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apex-recomp-dist
          path: dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar HTTP de la web publicada
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Comprobando $SITE_URL"
          curl --fail --location --retry 6 --retry-delay 10 --retry-all-errors --silent --show-error "$SITE_URL" -o /tmp/apex-index.html
          grep -q 'APEX' /tmp/apex-index.html
          curl --fail --location --retry 4 --retry-delay 5 --retry-all-errors --silent --show-error "${SITE_URL%/}/app.js" -o /tmp/apex-app.js
          test -s /tmp/apex-app.js
          echo 'Sitio y controlador principal accesibles por HTTPS'

